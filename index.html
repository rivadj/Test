    /* Fallback CDN automatico */
    @import url('https://cdn.jsdelivr.net/npm/dseg@0.4.6/css/dseg.min.css');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030503;
      color: #00ff66;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'DSEG7ClassicEmbedded', 'DSEG7-Classic', 'Courier New', monospace;
      overflow: hidden;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
    }

    /* Emoji dell'ape molto grande con bagliore verde coordinato */
    .bee-emoji {
      font-size: clamp(4rem, 12vw, 8rem);
      line-height: 1;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 15px rgba(0, 255, 102, 0.6)) drop-shadow(0 0 35px rgba(0, 255, 102, 0.3));
      animation: gentle-float 4s ease-in-out infinite;
    }

    @keyframes gentle-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Display LED Central */
    .led-display {
      position: relative;
      display: inline-block;
      text-align: center;
    }

    /* Cifre LED e stili bagliore neon */
    .digits {
      font-size: clamp(2.5rem, 8vw, 7rem);
      letter-spacing: 0.08em;
      line-height: 1;
      white-space: nowrap;
    }

    /* Segmenti disattivati per l'effetto fantasma */
    .digits-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: rgba(0, 255, 102, 0.06);
      pointer-events: none;
    }

    /* Segmenti attivi con effetto bagliore */
    .digits-fg {
      position: relative;
      z-index: 1;
      color: #00ff66;
      text-shadow: 
        0 0 5px rgba(0, 255, 102, 0.9),
        0 0 15px rgba(0, 255, 102, 0.6),
        0 0 30px rgba(0, 255, 102, 0.4),
        0 0 60px rgba(0, 255, 102, 0.2);
    }

    /* Label data target */
    .target-label {
      margin-top: 1.5rem;
      font-family: sans-serif;
      font-size: clamp(0.75rem, 2vw, 1rem);
      color: rgba(0, 255, 102, 0.4);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Emoji dell'Ape Grande -->
    <div class="bee-emoji" role="img" aria-label="Ape">🐝</div>

    <div class="led-display">
      <!-- Sfondo segmenti disattivati -->
      <div class="digits digits-bg" aria-hidden="true">88d 88:88:88</div>
      
      <!-- Cifre del contatore attive -->
      <div class="digits digits-fg" id="countdown">00d 00:00:00</div>
    </div>

    <div class="target-label">TARGET: 09 OCT 00:00:00</div>
  </div>

  <script>
    function getNextTargetDate() {
      const now = new Date();
      let targetYear = now.getFullYear();
      
      // Mese 9 = Ottobre (0-indexed in JS)
      let target = new Date(targetYear, 9, 9, 0, 0, 0);

      if (now.getTime() >= target.getTime()) {
        target = new Date(targetYear + 1, 9, 9, 0, 0, 0);
      }
      return target;
    }

    const targetDate = getNextTargetDate();

    function pad(num) {
      return String(num).padStart(2, '0');
    }

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById('countdown').textContent = "00d 00:00:00";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      const formattedTime = `${pad(days)}d ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
      document.getElementById('countdown').textContent = formattedTime;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
