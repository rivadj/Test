        :root {
            /* Colore LED acceso  */
            --led-on-color: #1aff1a;
            /* Colore segmenti spenti di sfondo */
            --led-off-color: #002200;
            /* Sfondo */
            --bg-color: #050505;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Contenitore principale del Display */
        .display-container {
            position: relative;
            background-color: #000;
            padding: 40px 60px;
            border-radius: 12px;
            border: 4px solid #1c1c1c;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9) inset, 0 0 15px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            cursor: pointer;
        }

        /* Applicazione del font LED */
        .led-font {
            font-family: 'DSEG7Classic-Local', 'VT323', monospace;
            font-style: italic; /* Inclinazione tipica dei LED */
            font-size: 55vh;    /* Dimensione dinamica full-screen */
            line-height: 1;
            letter-spacing: 0.02em;
        }

        /* Strato spento di sfondo (88) */
        .led-off {
            color: var(--led-off-color);
            position: absolute;
            top: 40px;
            left: 60px;
            z-index: 1;
        }

        /* Strato acceso del numero */
        .led-on {
            color: var(--led-on-color);
            position: relative;
            z-index: 2;
            /* Bagliore luminoso (Glow Effect) */
            text-shadow: 
                0 0 12px rgba(26, 255, 26, 0.9),
                0 0 25px rgba(26, 255, 26, 0.6),
                0 0 45px rgba(26, 255, 26, 0.3);
        }

        /* Controlli in basso */
        .controls-panel {
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .btn {
            background-color: #121212;
            color: #ccc;
            border: 2px solid #333;
            font-size: 32px;
            font-weight: bold;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:hover {
            background-color: #222;
            color: #fff;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        #btn-plus { color: #4caf50; border-color: #2e7d32; }
        #btn-minus { color: #f44336; border-color: #c62828; }

        #btn-plus:hover { background-color: #1b5e20; color: white; }
        #btn-minus:hover { background-color: #b71c1c; color: white; }

        .info-label {
            position: absolute;
            bottom: 12px;
            color: #444;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Display -->
    <div class="display-container" id="display" title="Doppio click per impostare il numero">
        <!-- Fondo spento -->
        <div class="led-font led-off">88</div>
        <!-- Cifre attive -->
        <div class="led-font led-on" id="counter-digits">00</div>
    </div>

    <!-- Controlli -->
    <div class="controls-panel">
        <button class="btn" id="btn-minus" title="Decrementa (- o Freccia Giù)">-</button>
        <button class="btn" id="btn-plus" title="Incrementa (+ o Freccia Su)">+</button>
    </div>

    <div class="info-label">Tasti + e - | Invio o Doppio Click per impostare cifra | F per Tutto Schermo</div>

    <script>
        let currentCount = 0;
        const maxCount = 99;
        const minCount = 0;

        const digitsEl = document.getElementById('counter-digits');
        const btnPlus = document.getElementById('btn-plus');
        const btnMinus = document.getElementById('btn-minus');
        const displayEl = document.getElementById('display');

        function updateDisplay() {
            digitsEl.textContent = String(currentCount).padStart(2, '0');
        }

        function increment() {
            if (currentCount < maxCount) {
                currentCount++;
                updateDisplay();
            }
        }

        function decrement() {
            if (currentCount > minCount) {
                currentCount--;
                updateDisplay();
            }
        }

        function promptForValue() {
            const userInput = prompt(`Inserisci il valore iniziale (${minCount} - ${maxCount}):`, currentCount);
            if (userInput === null) return;

            const parsedValue = parseInt(userInput, 10);

            if (!isNaN(parsedValue) && parsedValue >= minCount && parsedValue <= maxCount) {
                currentCount = parsedValue;
                updateDisplay();
            } else {
                alert(`Valore non valido. Inserisci un numero tra ${minCount} e ${maxCount}.`);
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        btnPlus.addEventListener('click', increment);
        btnMinus.addEventListener('click', decrement);
        displayEl.addEventListener('dblclick', promptForValue);

        document.addEventListener('keydown', (e) => {
            if (e.key === '+' || e.key === 'ArrowUp') {
                increment();
            } else if (e.key === '-' || e.key === 'ArrowDown') {
                decrement();
            } else if (e.key === 'Enter') {
                promptForValue();
            } else if (e.key.toLowerCase() === 'f') {
                toggleFullScreen();
            }
        });

        updateDisplay();
    </script>
</body>
</html>
